<dialog #dialog class="dialog" (cancel)="onCancel($event)">
  <h3 class="dialog-title">{{ title() }}</h3>

  @if (message()) {
    <p class="dialog-message">{{ message() }}</p>
  }

  <ng-content />

  <div class="dialog-actions">
    <button matButton type="button" [disabled]="busy()" (click)="cancelled.emit()">Cancel</button>
    <button
      matButton="filled"
      type="button"
      [class.danger]="variant() === 'danger'"
      [disabled]="busy()"
      (click)="confirmed.emit()"
    >
      {{ busy() ? 'Working...' : confirmLabel() }}
    </button>
  </div>
</dialog>
