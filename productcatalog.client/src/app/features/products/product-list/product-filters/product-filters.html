<div class="filters">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-search">
    <mat-label>Search by name</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      #searchInput
      type="search"
      placeholder="e.g. lens"
      maxlength="100"
      [value]="searchTerm()"
      (input)="searchTerm.set(searchInput.value)"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-stock">
    <mat-label>Min stock</mat-label>
    <input
      matInput
      #minInput
      type="number"
      min="0"
      step="1"
      [value]="minStock() ?? ''"
      (input)="setMinStock(minInput.value)"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-stock">
    <mat-label>Max stock</mat-label>
    <input
      matInput
      #maxInput
      type="number"
      min="0"
      step="1"
      [value]="maxStock() ?? ''"
      (input)="setMaxStock(maxInput.value)"
    />
  </mat-form-field>

  <div class="filter-actions">
    <button matButton="outlined" type="button" (click)="showLowStock()">Low stock</button>
    <button matButton type="button" (click)="clear()" [disabled]="!canClear()">Clear</button>
  </div>
</div>
