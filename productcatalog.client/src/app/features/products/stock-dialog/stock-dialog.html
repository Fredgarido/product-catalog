<app-confirm-dialog
  [open]="product() !== null"
  [title]="'Adjust stock: ' + (product()?.name ?? '')"
  [message]="'Current stock: ' + (product()?.stockQuantity ?? 0)"
  [confirmLabel]="mode() === 'add' ? 'Add stock' : 'Remove stock'"
  [busy]="saving()"
  (confirmed)="apply()"
  (cancelled)="closed.emit()"
>
  <mat-button-toggle-group
    class="mode-toggle"
    aria-label="Stock operation"
    [value]="mode()"
    (change)="mode.set($event.value)"
  >
    <mat-button-toggle value="add">Add</mat-button-toggle>
    <mat-button-toggle value="remove">Remove</mat-button-toggle>
  </mat-button-toggle-group>

  <mat-form-field appearance="outline" class="quantity-field">
    <mat-label>Quantity</mat-label>
    <input
      matInput
      type="number"
      min="1"
      step="1"
      [max]="limits.stockMax"
      [formControl]="quantity"
    />
    @if (quantity.invalid) {
      <mat-error>Enter a whole number between 1 and {{ limits.stockMax }}.</mat-error>
    }
  </mat-form-field>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }
</app-confirm-dialog>
